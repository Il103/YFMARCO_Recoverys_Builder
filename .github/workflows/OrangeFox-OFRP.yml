name: OrangeFox [OFRP]

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: ''
        type: choice
        options:
        - 14.1
        - 12.1
        - 11.0
        - 10.0
        - 9.0
        - 8.1
        - 7.1
        - 6.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/YFMARCO-Dev/recovery_device_tree'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'fox_14.1'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Use LDCHECK'
        required: false
        default: false
        type: boolean
      LDCHECKPATH:
        description: 'Path of blobs to check' # Use it know what kind of dependencies your missing for decryption blobs.
        required: true
        default: 'system/bin/qseecomd'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: self-hosted
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Self-hosted readiness check
      run: |
        echo "Running on: $(uname -a)"
        echo "Cores: $(nproc) | RAM: $(free -h | awk '/^Mem:/{print $2}') | Disk free: $(df -h / | awk 'NR==2{print $4}')"
        command -v sudo >/dev/null || { echo "::error::sudo is required on the self-hosted runner"; exit 1; }
        DISK_FREE=$(df --output=avail / | tail -1 | tr -dc '0-9')
        if [ -n "$DISK_FREE" ] && [ "$DISK_FREE" -lt 15728640 ]; then
          echo "::warning::Low disk space on self-hosted runner - recovery sync+build needs ~20GB+"
        fi
        echo "SELF_HOSTED=1" >> $GITHUB_ENV
        echo "Self-hosted runner OK"

    - name: Display Inputs
      run: |
        echo "Displaying variables/inputs."
        echo "Manifest Branch: ${{ inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ inputs.DEVICE_TREE }}"
        echo "Device Branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
        echo "Build Target: ${{ inputs.BUILD_TARGET }}image"
              
    - name: Clean-up (safe for self-hosted)
      run: |
        echo "Freeing caches without touching runner packages or apt lists..."
        sudo apt-get update -qq 2>/dev/null || true
        sudo apt-get clean 2>/dev/null || true
        sudo sync && sudo sysctl vm.drop_caches=3 2>/dev/null || true
        echo "Cleanup done"

    - name: Swap Space
      run: |
        echo "Ensuring swap utilities are installed..."
        sudo apt-get update -qq > /dev/null 2>&1 || true
        sudo apt-get install -y util-linux > /dev/null 2>&1 || true
        command -v swapon > /dev/null || { echo "::warning::swapon not available, skipping swap setup"; free -h; exit 0; }
        SIZE_GB=12
        SWAP_FILE=/swapfile
        NEEDED=$((SIZE_GB * 1024 * 1024 * 1024))
        EXISTING=0
        if [ -f "$SWAP_FILE" ]; then EXISTING=$(stat -c%s "$SWAP_FILE" 2>/dev/null || echo 0); fi
        if [ "$EXISTING" -ge "$NEEDED" ]; then
          echo "Swap file already at least ${SIZE_GB}G, just enabling it..."
          sudo swapon "$SWAP_FILE" 2>/dev/null || true
        else
          echo "Creating ${SIZE_GB}G swapfile..."
          sudo swapoff "$SWAP_FILE" 2>/dev/null || true
          sudo rm -f "$SWAP_FILE"
          sudo fallocate -l ${SIZE_GB}G "$SWAP_FILE" 2>/dev/null || \
            sudo dd if=/dev/zero of="$SWAP_FILE" bs=1M count=$((SIZE_GB * 1024)) status=none
          sudo chmod 600 "$SWAP_FILE"
          sudo mkswap "$SWAP_FILE" > /dev/null 2>&1
          sudo swapon "$SWAP_FILE"
        fi
        echo "Swap status:"
        free -h
        swapon --show
      
    - name: Build Environment
      run: |
        sudo apt-get update -qq
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
      
    - name: Install Git-Repo
      run: |
        command -v repo >/dev/null 2>&1 && echo "repo already installed" && exit 0
        mkdir -p ~/bin
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
        repo --version 2>/dev/null || echo "::warning::repo could not be installed"

    - name: Set-up Manifest
      run: |
        echo "Disk space before sync:"
        df -h | grep -E 'Filesystem|/$|/home' || df -h
        echo "Removing leftover builds from previous runs to free quota..."
        sudo rm -rf ${GITHUB_WORKSPACE}/OrangeFox 2>/dev/null || true
        sudo apt-get clean 2>/dev/null || true
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        echo "Tuning git for big AOSP syncs..."
        git config --global http.postBuffer 524288000
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 600
        git config --global pack.threads 4
        git clone https://gitlab.com/OrangeFox/sync.git
        if [ ${{ inputs.MANIFEST_BRANCH }} == '11.0' ] || [ ${{ inputs.MANIFEST_BRANCH }} == '12.1' ] || [ ${{ inputs.MANIFEST_BRANCH }} == '14.1' ]; then
            echo "Sync fox_${{ inputs.MANIFEST_BRANCH }} branch"
            echo "CHECK_LEGACY_BRANCH=false" >> $GITHUB_ENV
            cd sync
            for i in 1 2 3 4; do
                echo "=== Sync attempt $i (branch ${{ inputs.MANIFEST_BRANCH }}) ==="
                if ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}; then
                    echo "Sync succeeded on attempt $i"
                    break
                fi
                echo "::warning::Sync attempt $i failed - retrying (resumes from partial download)"
                df -h | grep -E 'Filesystem|/$|/home' || df -h
            done
        else
            echo "Sync legacy fox_${{ inputs.MANIFEST_BRANCH }} branch"
            echo "CHECK_LEGACY_BRANCH=true" >> $GITHUB_ENV
            cd sync/legacy
            for i in 1 2 3 4; do
                echo "=== Legacy sync attempt $i (branch ${{ inputs.MANIFEST_BRANCH }}) ==="
                if ./orangefox_sync_legacy.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}; then
                    echo "Sync succeeded on attempt $i"
                    break
                fi
                echo "::warning::Legacy sync attempt $i failed - retrying (resumes from partial download)"
            done
        fi
        df -h | grep -E 'Filesystem|/$|/home' || df -h

    - name: Ensure Guava dependency exists
      if: inputs.MANIFEST_BRANCH == '14.1'
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        if [ -f external/guava/Android.bp ] && grep -q 'name:[[:space:]]*"guava"' external/guava/Android.bp; then
          echo "guava module is already available."
        else
          echo "guava module missing after sync. Cloning fallback project..."
          rm -rf external/guava
          git clone --depth=1 https://android.googlesource.com/platform/external/guava external/guava
        fi

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        git clone https://$(echo "${{ secrets.RECOVERY_USERNAME }}" | sed 's/@/%40/'):${{ secrets.RECOVERY_TOKEN }}@$(echo "${{ inputs.DEVICE_TREE }}" | sed 's~https://~~') -b ${{ inputs.DEVICE_TREE_BRANCH }} ./device_tree
        cd device_tree
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Extracting variables from .mk file
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/device_tree
        # Initialize variables
        DEVICE_MAKEFILE=""
        DEVICE_DIRECTORY=""
        DEVICE_NAME=""
        # Loop through each .mk file in the current directory
        for file in *.mk; do
            # Extract variables using sed
            makefile=$(sed -n 's/^[[:space:]]*PRODUCT_NAME[[:space:]]*:=\s*\(.*\)/\1/p' "$file")
            brand=$(sed -n 's/^[[:space:]]*PRODUCT_BRAND[[:space:]]*:=\s*\(.*\)/\1/p' "$file")
            codename=$(sed -n 's/^[[:space:]]*PRODUCT_DEVICE[[:space:]]*:=\s*\(.*\)/\1/p' "$file")
            if [[ -n "$makefile" && -n "$brand" && -n "$codename" ]]; then
                DEVICE_MAKEFILE="$makefile"
                DEVICE_DIRECTORY="device/$brand"
                DEVICE_NAME="$codename"
                echo "DEVICE_MAKEFILE=${DEVICE_MAKEFILE}" >> $GITHUB_ENV
                echo "DEVICE_NAME=${DEVICE_NAME}" >> $GITHUB_ENV
                echo "DEVICE_DIRECTORY=${DEVICE_DIRECTORY}" >> $GITHUB_ENV
                break
            fi
        done
        # Navigate to the parent directory
        cd ../
        # Create the necessary directories
        echo "Creating directory: $DEVICE_DIRECTORY"
        mkdir -p "$DEVICE_DIRECTORY"
        # Move device_tree folder to device_directory and rename it to $DEVICE_NAME
        echo "Moving device_tree to $DEVICE_DIRECTORY/$DEVICE_NAME"
        mv device_tree "$DEVICE_DIRECTORY"/"$DEVICE_NAME"

    - name: Installing python2 for legacy builds
      if: env.CHECK_LEGACY_BRANCH == 'true'
      run: |
        sudo apt-get install -y python2 python-is-python2 || \
        sudo apt-get install -y python2.7 || \
        ( wget -q "http://archive.ubuntu.com/ubuntu/pool/universe/p/python2/python2_2.7.18-3~20.04.3_amd64.deb" -O /tmp/python2.deb && sudo dpkg -i /tmp/python2.deb ) || \
        true
        command -v python2 || echo "::warning::python2 not found - legacy branch may fail to build"

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        if [ ${{ inputs.MANIFEST_BRANCH }} == '14.1' ]; then
            lunch twrp_${{ env.DEVICE_NAME }}-ap2a-eng && make clean && mka adbd ${{ inputs.BUILD_TARGET }}image
        elif [ ${{ inputs.MANIFEST_BRANCH }} == '11.0' ] || [ ${{ inputs.MANIFEST_BRANCH }} == '12.1' ]; then
            lunch twrp_${{ env.DEVICE_NAME }}-eng && make clean && mka adbd ${{ inputs.BUILD_TARGET }}image
        else
            lunch omni_${{ env.DEVICE_NAME }}-eng && make clean && mka ${{ inputs.BUILD_TARGET }}image
        fi

    - name: Set Build Date # For Build Date Info, currently using Asia/Manila
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV

    - name: Check if Recovery Exist
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        if [ -f out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.img ]; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "Recovery out directory is empty."
        fi
        if [ -f out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.zip ]; then
            echo "CHECK_ZIP_IS_OK=true" >> $GITHUB_ENV
            echo "MD5_ZIP=$(md5sum out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.zip | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "Recovery out directory is empty."
        fi

    - name: Upload to Release
      if: env.CHECK_IMG_IS_OK == 'true' && env.CHECK_ZIP_IS_OK == 'true'
      uses: softprops/action-gh-release@v2.3.0
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.img.tar
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.zip
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/ramdisk-recovery.*
        name: Unofficial OrangeFox for ${{ env.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        token: ${{ secrets.RECOVERY_TOKEN }}
        body: |
          Build: ${{ inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.
          MD5 (img): ${{ env.MD5_IMG }}
          MD5 (zip): ${{ env.MD5_ZIP }}
          
    - name: Run LDCheck
      if: inputs.LDCHECK == 'true'
      run: |
        cd tools
        mv -n libneeds ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/recovery/root/
        mv -n ldcheck ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/recovery/root/
        cd ../OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/recovery/root
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ inputs.LDCHECKPATH }}
        echo "Done checking missing dependencies. Review, and reconfigure your tree."
      continue-on-error: true
